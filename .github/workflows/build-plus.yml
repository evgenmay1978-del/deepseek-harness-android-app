name: build-plus
on:
  workflow_dispatch:
  push:
    branches: [plus]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASS: dsh-plus-local
      KEYSTORE_ALIAS: dsh
      UPSTREAM_APK: https://github.com/woaiys3/deepseek-harness-android-app/releases/download/v1.16.1/DeepSeekHarness-official-v1.16.1.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android build-tools в PATH
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PL=$(ls -d "$ANDROID_HOME"/platforms/android-3* | sort -V | tail -1)
          echo "build-tools: $BT"; echo "platform: $PL"
          echo "$BT" >> "$GITHUB_PATH"
          echo "ANDROID_JAR=$PL/android.jar" >> "$GITHUB_ENV"
      - name: Кэш ключа подписи
        uses: actions/cache@v4
        with:
          path: android-app/release.jks
          key: dsh-plus-keystore-v1
      - name: Создать ключ, если нет
        run: |
          if [ ! -f android-app/release.jks ]; then
            keytool -genkeypair -keystore android-app/release.jks -alias "$KEYSTORE_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
              -dname "CN=DSH Plus,O=Personal,C=RU"
          fi
      - name: Скачать APK upstream (источник payload)
        run: curl -fsSL -o upstream.apk "$UPSTREAM_APK"
      - name: Подготовить devhome
        run: bash ci/prepare-devhome.sh upstream.apk "$PWD/devhome" com.deepseek.harness.plus
      - name: Сборка
        env:
          DSH_DEV_HOME: ${{ github.workspace }}/devhome
          JAVA_BIN: ${{ env.JAVA_HOME }}/bin
        run: cd android-app && bash build.sh   # build.sh использует source — нужен bash, а не dash
      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Plus-apk
          path: android-app/DeepSeekHarness.apk
      - name: Ключ (сохранить копию)
        uses: actions/upload-artifact@v4
        with:
          name: dsh-plus-keystore
          path: android-app/release.jks

name: release-plus
# Наш канал обновлений: по тегу v* собираем APK и публикуем релиз в ЭТОМ репозитории.
# Ключ подписи обязан быть постоянным: при смене ключа Android не поставит обновление поверх прежней версии.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_ALIAS: dsh
      UPSTREAM_APK: https://github.com/woaiys3/deepseek-harness-android-app/releases/download/v1.16.1/DeepSeekHarness-official-v1.16.1.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android build-tools в PATH
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PL=$(ls -d "$ANDROID_HOME"/platforms/android-3* | sort -V | tail -1)
          echo "$BT" >> "$GITHUB_PATH"
          echo "ANDROID_JAR=$PL/android.jar" >> "$GITHUB_ENV"
      - name: Ключ подписи (постоянный, из секрета)
        env:
          KEYSTORE_B64: ${{ secrets.DSH_PLUS_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.DSH_PLUS_KEYSTORE_PASS }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android-app/release.jks
            echo "ключ взят из секрета — версия будет ставиться поверх предыдущей"
          else
            echo "::error::нет секрета DSH_PLUS_KEYSTORE_B64 — релиз не публикуем, иначе обновление не встанет поверх прежней версии"
            exit 1
          fi
      - name: Скачать APK upstream (источник payload)
        run: curl -fsSL -o upstream.apk "$UPSTREAM_APK"
      - name: Подготовить devhome (с нашим плагином)
        run: bash ci/prepare-devhome.sh upstream.apk "$PWD/devhome" com.deepseek.harness.plus
      - name: Сборка
        env:
          DSH_DEV_HOME: ${{ github.workspace }}/devhome
          JAVA_BIN: ${{ env.JAVA_HOME }}/bin
        run: cd android-app && sh build.sh
      - name: Переименовать APK по тегу
        run: |
          VER="${GITHUB_REF_NAME:-manual}"
          cp android-app/DeepSeekHarness.apk "DSH-Plus-$VER.apk"
          echo "APK_NAME=DSH-Plus-$VER.apk" >> "$GITHUB_ENV"
      - name: Публикация релиза (наш канал обновлений)
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          name: DSH Plus ${{ github.ref_name }}
          body: |
            Сборка форка DSH Plus с вложенным плагином dsh-tool-agent-kit
            (память, каталог скиллов, диспетчер инструментов, аудит, планировщик).
            Плагин ставится сборкой автоматически; ключ подписи постоянный —
            версия ставится поверх предыдущей.
          generate_release_notes: true